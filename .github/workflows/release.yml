name: Release

# Runs on every push to main. release-please tracks state itself via
# .release-please-manifest.json and the PRs it has already opened, so
# a run with nothing new to release is a no-op rather than a duplicate.
on:
  push:
    branches: ["main"]

# Needs to open/update PRs and push tags/commits (the release PR branch
# and, on merge, the version tag + GitHub Release).
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    env:
      # Opt into Node.js 24 now ahead of the June 2, 2026 forced migration.
      # Avoids a breaking change when GitHub drops Node.js 20 support for actions.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      # A PAT is required instead of the default GITHUB_TOKEN: GitHub blocks
      # GITHUB_TOKEN-authored pull requests from triggering other workflow
      # runs, which would leave the release PR with no CI status.
      - name: Run release-please
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          # node release-type bumps package.json/package-lock.json and
          # keeps CHANGELOG.md in the same conventional-changelog format
          # already used for v0.1.1-v0.1.3.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

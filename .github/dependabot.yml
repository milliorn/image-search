# Dependabot configuration file
# Docs: https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      next:
        patterns:
          - "next"
          - "eslint-config-next"
      jest:
        patterns:
          - "jest"
          - "jest-environment-jsdom"
          - "@types/jest"
      testing-library:
        patterns:
          - "@testing-library/*"
      tailwindcss:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/postcss"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
